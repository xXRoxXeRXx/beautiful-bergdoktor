services:
  bergdoktorbot:
    build: .
    container_name: bergdoktorbot
    env_file:
      - .env
    environment:
      - DB_PATH=/data/bergdoktorbot.db
    volumes:
      - bot_data:/data
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  bot_data: